<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="pkg — the tools behind the signal">
<style>
  text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;fill:#c9d6f2}
  .dim{fill:#5b6b8c} .g{fill:#39ff88} .c{fill:#22d3ee} .p{fill:#ff3df2} .a{fill:#ffb020}
  .b{font-weight:700}
  .in{opacity:0;animation:in .45s ease-out forwards}
  .slide{opacity:0;animation:slide .6s cubic-bezier(.2,.8,.2,1) forwards}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes in{to{opacity:1}}
  .out{animation:out .1s forwards}@keyframes out{to{opacity:0}}
  @keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
  .sweep{animation:sweep 6s linear infinite}@keyframes sweep{from{transform:translateY(-120px)}to{transform:translateY(570px)}}
</style>
<defs>
  <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1220"/><stop offset="1" stop-color="#07090f"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity="0"/><stop offset=".5" stop-color="#39ff88" stop-opacity=".07"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="win"><rect x="1" y="1" width="1198" height="448" rx="14"/></clipPath>
  <pattern id="stripe" width="12" height="16" patternUnits="userSpaceOnUse" patternTransform="skewX(-30)"><rect width="5" height="16" fill="#000"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 0" dur="1s" repeatCount="indefinite" additive="sum"/></pattern>
</defs>
