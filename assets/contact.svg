  <linearGradient id="sweepG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39ff88" stop-opacity="0"/><stop offset=".5" stop-color="#39ff88" stop-opacity=".07"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
