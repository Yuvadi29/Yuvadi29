  <text x="600" y="24" text-anchor="middle" font-size="13" class="dim">ssh — say hello</text>
  <text x="40" y="82" font-size="18" class="p b">❯</text><g clip-path="url(#typeSsh)"><text x="61.672" y="82" font-size="18" textLength="303.4" lengthAdjust="spacingAndGlyphs">ssh visitor@adityatrivedi.in</text></g><text x="40" y="118" font-size="15" class="dim in" style="animation-delay:2.20s">Resolving adityatrivedi.in ... Bengaluru, IN</text><text x="40" y="142" font-size="15" class="dim in" style="animation-delay:2.70s">Handshake: curiosity ⇄ craft ⇄ shipping  [ok]</text><text x="40" y="166" font-size="15" class="g in" style="animation-delay:3.20s">Connection established.</text><text x="40" y="228" font-size="26" class="b in" style="animation-delay:4s">Make something worth <tspan class="g" filter="url(#glow)">noticing</tspan>.<tspan class="g blink"> █</tspan></text><g class="out" style="animation-delay:2.20s"><rect x="61.672" y="66.7" width="9.7524" height="18.900000000000002" fill="#39ff88" class="blink"><animate attributeName="x" values="61.7;72.5;83.4;94.2;105.0;115.9;126.7;137.6;148.4;159.2;170.1;180.9;191.7;202.6;213.4;224.2;235.1;245.9;256.7;267.6;278.4;289.3;300.1;310.9;321.8;332.6;343.4;354.3;365.1" keyTimes="0.0000;0.0357;0.0714;0.1071;0.1429;0.1786;0.2143;0.2500;0.2857;0.3214;0.3571;0.3929;0.4286;0.4643;0.5000;0.5357;0.5714;0.6071;0.6429;0.6786;0.7143;0.7500;0.7857;0.8214;0.8571;0.8929;0.9286;0.9643;1.0000" calcMode="discrete" begin="0.5s" dur="1.4000000000000001s" fill="freeze"/></rect></g>
  <rect width="1200" height="250" fill="url(#scan)" pointer-events="none"/>
